name: Aktualizacja okładek
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_covers.py
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add games.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja okładek"
            git push
          fi
